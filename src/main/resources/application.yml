spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: coponderus-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:coponderus}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:coponderus}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:coponderus}}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Le schema est piloté par Flyway, pas par Hibernate : "validate" verifie
    # que les entites correspondent au schema, sans jamais le modifier lui-meme.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/coponderus
          jwk-set-uri: https://www.googleapis.com/robot/v1/metadata/jwk/securetoken@system.gserviceaccount.com
server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
